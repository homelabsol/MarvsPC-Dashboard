<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarvsPC-Piso · Dashboard ng owner</title>
<style>
  /* One design: a calm light background, white cards with a thin border, a navy side menu and ONE accent (gold).
     Every tile has the same size and the same colour; colour is used only to say something (ok, warning, problem). */
  :root { --bg:#f3f5f9; --surface:#fff; --ink:#0f1f3a; --muted:#5b6b84; --line:#e2e8f1; --navy:#10233f; --navy2:#1b3157; --gold:#f5b82e; --tint:#eaf0f8;
          --ok:#14532d; --okbg:#dcfce7; --warn:#78350f; --warnbg:#fef3c7; --bad:#7f1d1d; --badbg:#fee2e2; --info:#1e3a8a; --infobg:#dbeafe;
          --shadow:0 1px 2px rgba(16,35,63,.05), 0 6px 18px rgba(16,35,63,.05); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14.5px/1.5 Inter, "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  .hidden { display:none !important; }
  button, input { font:inherit; color:inherit; }
  input { padding:9px 12px; border:1px solid #c9d4e4; border-radius:10px; background:#fff; min-height:42px; width:100%; }
  button { padding:0 16px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; min-height:42px; font-weight:600; transition:background .15s, border-color .15s; }
  button:hover { background:#f6f8fc; border-color:#cdd8e8; }
  button.primary { background:var(--navy); color:#fff; border-color:var(--navy); }
  button.primary:hover { background:var(--navy2); }
  button:focus-visible, input:focus-visible, a:focus-visible { outline:3px solid var(--gold); outline-offset:1px; }
  button:disabled { opacity:.55; cursor:default; }
  .btn-ok { background:#15803d; border-color:#15803d; color:#fff; }
  .btn-ok:hover { background:#166f37; border-color:#166f37; }
  .btn-no { color:#b91c1c; border-color:#e7b4b4; background:#fff; }
  .btn-no:hover { background:#fff5f5; }

  .top { background:var(--navy); color:#f2f5fa; height:60px; padding:0 22px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #20395f; }
  .logo { width:34px; height:34px; border-radius:9px; background:var(--gold); color:var(--navy); display:grid; place-items:center; font-weight:800; font-size:14px; }
  .top b { font-size:16px; letter-spacing:.01em; }
  .top .who { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:13px; color:#b9c7de; }
  .top button { background:transparent; color:#e8eefb; border-color:#3a5886; min-height:36px; padding:0 14px; }
  .top button:hover { background:#1b3157; }

  .shell { display:grid; grid-template-columns:232px minmax(0, 1fr); min-height:calc(100vh - 60px); }
  .side { background:var(--navy); padding:18px 12px; display:flex; flex-direction:column; gap:4px; align-content:start; }
  .side a { display:flex; align-items:center; gap:12px; padding:0 14px; border-radius:10px; color:#c5d2e8; text-decoration:none; font-weight:600; min-height:42px; }
  .side a:hover { background:rgba(255,255,255,.07); color:#fff; }
  .side a[aria-current="page"] { background:var(--gold); color:var(--navy); }
  .side a svg { flex:0 0 20px; }
  .badge { margin-left:auto; background:#dc2626; color:#fff; border-radius:99px; min-width:22px; padding:1px 7px; font-size:12px; text-align:center; }
  main { padding:26px 30px 48px; max-width:1360px; width:100%; display:grid; gap:16px; align-content:start; }
  .page { display:grid; gap:16px; }

  /* the branch tabs and the date ranges: one calm segmented control */
  .tabs, .range { display:inline-flex; flex-wrap:wrap; gap:4px; padding:4px; background:#e6ecf5; border-radius:12px; width:fit-content; max-width:100%; }
  .tabs button, .range button { min-height:34px; padding:0 16px; border:0; background:transparent; border-radius:9px; color:var(--muted); }
  .tabs button:hover, .range button:hover { background:rgba(255,255,255,.55); }
  .tabs button[aria-pressed="true"], .range button[aria-pressed="true"] { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(16,35,63,.16); }

  .login { max-width:400px; margin:12vh auto; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:28px; display:grid; gap:12px; box-shadow:var(--shadow); }
  .login h1 { margin:0; font-size:22px; }
  .login label { display:grid; gap:5px; font-size:13px; color:var(--muted); }
  .msg { min-height:21px; font-size:14px; color:#b91c1c; margin:0; }

  .live { font-size:12.5px; border-radius:99px; padding:4px 12px; display:inline-flex; align-items:center; gap:8px; font-weight:600; }
  .live i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .ok { background:var(--okbg); color:var(--ok); } .ok i { background:#16a34a; }
  .stale { background:var(--warnbg); color:var(--warn); } .stale i { background:#d97706; }

  /* the tiles: all the same size, all the same colour */
  .kpis { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:14px; }
  .kpis.six { grid-template-columns:repeat(3, minmax(0, 1fr)); }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; min-height:96px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; box-shadow:var(--shadow); }
  .kpi .kl { display:block; color:var(--muted); font-size:13px; line-height:1.3; }
  .kpi b { display:block; font-size:26px; line-height:1.2; margin-top:8px; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .kpi .ki { flex:0 0 38px; height:38px; border-radius:10px; background:var(--tint); color:var(--navy2); display:grid; place-items:center; }

  .block { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; min-width:0; box-shadow:var(--shadow); }
  .block h2 { margin:0 0 12px; font-size:16px; letter-spacing:.005em; }
  .grid2 { display:grid; grid-template-columns:minmax(0, 3fr) minmax(0, 2fr); gap:16px; align-items:stretch; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:11px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover td { background:#fafbfd; }
  th { font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:700; }
  td { font-variant-numeric:tabular-nums; }
  .num { text-align:right; } td.num, th.num { text-align:right; }
  .pill { display:inline-flex; align-items:center; gap:7px; border-radius:99px; padding:2px 11px; font-weight:600; font-size:12.5px; }
  .pill i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .p-vacant { background:var(--okbg); color:var(--ok); } .p-vacant i { background:#16a34a; }
  .p-in_use { background:var(--infobg); color:var(--info); } .p-in_use i { background:#2563eb; }
  .p-parked { background:#ede9fe; color:#4c1d95; } .p-parked i { background:#7c3aed; }
  .p-maintenance { background:var(--warnbg); color:var(--warn); } .p-maintenance i { background:#d97706; }
  .p-offline { background:#e8edf4; color:#334155; } .p-offline i { background:#64748b; }
  .chart { display:flex; align-items:flex-end; gap:10px; height:180px; border-bottom:1px solid var(--line); padding-top:8px; }
  .chart .col { flex:1 1 0; height:100%; display:flex; align-items:flex-end; justify-content:center; gap:4px; }
  .chart .col i { width:16px; border-radius:4px 4px 0 0; display:block; min-height:2px; }
  .lbl { display:flex; gap:10px; padding-top:8px; font-size:12px; color:var(--muted); }
  .lbl div { flex:1 1 0; text-align:center; } .lbl b { display:block; color:var(--ink); }
  .legend { display:flex; flex-wrap:wrap; gap:16px; font-size:12.5px; color:var(--muted); margin-bottom:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:0; }
  .empty { color:var(--muted); }
  .foot { font-size:12.5px; color:var(--muted); margin:6px 0 0; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
  .toolbar input { max-width:260px; }
  .notice { margin:0 0 10px; padding:10px 14px; border-radius:10px; background:var(--okbg); color:var(--ok); font-weight:600; }

  @media (max-width: 1100px) { .kpis, .kpis.six { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 900px) { .grid2 { grid-template-columns:minmax(0, 1fr); } }
  @media (max-width: 800px) {
    main { padding:16px 14px 92px; }
    .top { padding:0 14px; } .top .who span { display:none; }
    .shell { display:block; }
    .side { position:fixed; left:0; right:0; bottom:0; z-index:5; flex-direction:row; padding:6px; gap:2px; overflow-x:auto; border-top:1px solid #2a4570; }
    .side a { flex:1 0 76px; flex-direction:column; justify-content:center; gap:3px; font-size:11px; padding:6px 4px; border-radius:10px; text-align:center; position:relative; min-height:52px; }
    .side .badge { position:absolute; top:2px; right:14px; margin:0; }
    .kpi { padding:12px 14px; min-height:84px; } .kpi b { font-size:22px; } .kpi .ki { display:none; }
  }

  .pagehead { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .pagehead h1 { margin:0; font-size:22px; }
  .pagehead .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .fields { display:flex; flex-wrap:wrap; gap:12px; align-items:end; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 16px; box-shadow:var(--shadow); }
  .fields label { display:grid; gap:4px; font-size:12px; color:var(--muted); }
  .fields input[type=date] { min-height:40px; width:160px; }
  .fields .sw { display:flex; align-items:center; gap:8px; color:var(--ink); font-size:14px; min-height:40px; cursor:pointer; }
  .sw input { position:absolute; opacity:0; width:1px; height:1px; }
  .sw i { width:38px; height:22px; border-radius:99px; background:#c5d0e2; position:relative; display:inline-block; transition:background .15s; flex:0 0 38px; }
  .sw i::after { content:""; position:absolute; left:3px; top:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; }
  .sw input:checked + i { background:var(--navy); } .sw input:checked + i::after { left:19px; }
  .sw input:focus-visible + i { outline:3px solid var(--gold); outline-offset:2px; }
  .delta { display:block; font-size:12px; margin-top:4px; color:var(--muted); } .delta.up, td.up { color:#15803d; } .delta.down, td.down { color:#b45309; }
  .top3 { display:grid; grid-template-columns:minmax(0, 2fr) minmax(0, 1fr); gap:16px; }
  .two { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:16px; }
  .split { display:flex; height:26px; border-radius:8px; overflow:hidden; margin:10px 0 8px; background:#e6ecf5; } .split span { display:block; }
  .legend2 { display:flex; flex-wrap:wrap; gap:18px; font-size:13px; color:var(--muted); } .legend2 i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; }
  .notice.warn { background:var(--warnbg); color:var(--warn); }
  .printhead { display:none; }
  @media (max-width: 900px) { .top3, .two { grid-template-columns:minmax(0, 1fr); } }
  @media print {
    body { background:#fff; } .top, .side, .tabs, .range, .fields, .pagehead .actions, .foot, .toolbar, button { display:none !important; }
    .shell { display:block; } main { padding:0; max-width:none; }
    .block, .kpi { box-shadow:none; break-inside:avoid; } .printhead { display:flex; justify-content:space-between; gap:12px; font-size:16px; border-bottom:2px solid #10233f; padding-bottom:8px; }
    .pagehead h1 { font-size:20px; }
  }
  .cfggrid { display:grid; gap:12px; }
  .cfgrow { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:10px; align-items:center; font-size:14px; }
  .cfgrow.check { grid-template-columns:auto 1fr; justify-content:start; cursor:pointer; }
  .cfgrow.check input { width:20px; min-height:20px; }
  .cfgrow select { min-height:42px; border:1px solid #c9d4e4; border-radius:10px; padding:0 10px; background:#fff; width:100%; }
  .raterows { display:grid; gap:8px; }
  .raterow { display:grid; grid-template-columns:auto minmax(70px, 1fr) auto minmax(80px, 1fr) auto auto; gap:8px; align-items:center; }
  .raterow button { min-height:38px; padding:0 12px; }
</style>
</head>
<body>

<div class="login hidden" id="loginBox">
  <h1>Dashboard ng owner</h1>
  <p class="foot" style="margin:0">Mag-login gamit ang email at password na ibinigay ng MarvsPC.</p>
  <form id="loginForm" style="display:grid;gap:12px">
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Pumasok</button>
    <p class="msg" id="loginMsg" role="status"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="logo" aria-hidden="true">MP</div><b>MarvsPC-Piso</b>
    <div class="who"><span id="who"></span><button type="button" id="refresh">I-refresh</button><button type="button" id="logout">Logout</button></div>
  </header>
  <div class="shell">
    <nav class="side" id="side" aria-label="Mga bahagi ng dashboard"></nav>
    <main>
      <div class="tabs" id="tabs" role="group" aria-label="Mga branch"></div>
      <div id="view"></div>
      <p class="foot" id="foot"></p>
    </main>
  </div>
</div>

<script>
// Public project key (not a secret). The data is protected by the Firestore rules, not by this key.
const API_KEY = "AIzaSyBVsogVXAX6BX8wwfNoosjL0BHci4h2Mgk", PROJECT = "cashlesspisonet";
let RTDB = "https://cashlesspisonet-default-rtdb.asia-southeast1.firebasedatabase.app", ALIVE_MS = 100000, alive = {}, seen = {};
let AUTH = "https://identitytoolkit.googleapis.com/v1", TOKEN = "https://securetoken.googleapis.com/v1/token", STORE = "https://firestore.googleapis.com/v1";
{ // tests only, and only on this computer: point the page at a pretend Firebase
  const t = new URLSearchParams(location.search).get("test_api");
  if (t && ["localhost", "127.0.0.1"].includes(location.hostname)) { AUTH = t + "/idt/v1"; TOKEN = t + "/tok/v1/token"; STORE = t + "/fs/v1"; RTDB = t + "/rtdb";
    const ms = parseInt(new URLSearchParams(location.search).get("test_alive_ms"), 10); if (ms) ALIVE_MS = ms; }
}
const $ = (s) => document.querySelector(s);
const RT = "marvspc_rt";
let idToken = null, uid = null, shops = [], current = "all", timer = null, tick = null, fetchedAt = null, lastActive = Date.now();
// Updates by itself: every 15 seconds while someone is looking at the page, every 2 minutes when nobody
// touched it for 5 minutes, and not at all while the tab is hidden (every read counts against the free quota).
for (const ev of ["mousemove", "keydown", "click", "touchstart", "scroll"]) addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true });
let fastUntil = 0, decided = {}, notice = null;      // decided: what the owner pressed and the Hub has not answered yet
const pollDelay = () => (Date.now() < fastUntil ? 3000 : Date.now() - lastActive < 300000 ? 15000 : 120000);
async function poll() {
  clearTimeout(timer);
  if (!idToken) return;
  if (!document.hidden) await load().catch(() => {});
  timer = setTimeout(poll, document.hidden ? 15000 : pollDelay());
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && idToken) poll(); });

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") e.className = v; else if (v !== null && v !== undefined) e.setAttribute(k, v); }
  for (const k of kids.flat()) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const peso = (n) => "₱" + Number(n || 0).toLocaleString("en-PH", { maximumFractionDigits: 2 });
function mins(m) { const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h} oras ${r} min` : `${h} oras`) : `${r} min`; }
function clock(sec) { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60; return `${h}:${String(m).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`; }

// ---- Firestore typed values -> plain values ----
function fromFs(v) {
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(fromFs);
  if ("mapValue" in v) return Object.fromEntries(Object.entries(v.mapValue.fields || {}).map(([k, x]) => [k, fromFs(x)]));
  return null;
}

// ---- sign-in ----
async function post(url, body, headers) {
  const r = await fetch(url, { method: "POST", headers: headers || { "Content-Type": "application/json" }, body });
  return [r, await r.json().catch(() => ({}))];
}
async function get(url) {
  const r = await fetch(url, { headers: { Authorization: "Bearer " + idToken } });
  return [r, await r.json().catch(() => ({}))];
}
async function signIn(email, password) {
  const [r, d] = await post(`${AUTH}/accounts:signInWithPassword?key=${API_KEY}`, JSON.stringify({ email, password, returnSecureToken: true }));
  if (!r.ok) {
    const code = ((d.error || {}).message || "").split(" ")[0];
    throw new Error(code === "TOO_MANY_ATTEMPTS_TRY_LATER" ? "Masyadong maraming subok. Maghintay muna." : "Mali ang email o password.");
  }
  idToken = d.idToken; uid = d.localId; localStorage.setItem(RT, d.refreshToken); $("#who").textContent = email;
}
async function resume() {
  const rt = localStorage.getItem(RT);
  if (!rt) return false;
  const [r, d] = await post(`${TOKEN}?key=${API_KEY}`, `grant_type=refresh_token&refresh_token=${encodeURIComponent(rt)}`, { "Content-Type": "application/x-www-form-urlencoded" });
  if (!r.ok) { localStorage.removeItem(RT); return false; }
  idToken = d.id_token; uid = d.user_id; localStorage.setItem(RT, d.refresh_token || rt);
  return true;
}
function leave() { localStorage.removeItem(RT); idToken = null; clearTimeout(timer); clearInterval(tick); $("#app").classList.add("hidden"); $("#loginBox").classList.remove("hidden"); }

// ---- load the owner's shops (the filter on ownerUid is what the security rules require) ----
async function load() {
  const q = { structuredQuery: { from: [{ collectionId: "shops" }], where: { fieldFilter: { field: { fieldPath: "ownerUid" }, op: "EQUAL", value: { stringValue: uid } } } } };
  let [r, d] = await post(`${STORE}/projects/${PROJECT}/databases/(default)/documents:runQuery`, JSON.stringify(q), { "Content-Type": "application/json", Authorization: "Bearer " + idToken });
  if (r.status === 401 && await resume()) {
    [r, d] = await post(`${STORE}/projects/${PROJECT}/databases/(default)/documents:runQuery`, JSON.stringify(q), { "Content-Type": "application/json", Authorization: "Bearer " + idToken });
  }
  if (r.status === 401) return leave();
  if (r.status === 403) { $("#view").replaceChildren(el("p", { class: "block" }, "Hindi pa naka-activate ang account na ito. Sabihin sa MarvsPC na idagdag ito.")); return; }
  if (!r.ok) throw new Error("Hindi makuha ang data.");
  shops = d.filter((x) => x.document).map((x) => fromFs({ mapValue: { fields: x.document.fields } }));
  shops.sort((a, b) => a.shopName.localeCompare(b.shopName));
  await loadAlive();
  fetchedAt = new Date();
  settleDecisions();
  settleConfig();
  draw();
}

// ---- drawing ----
const STATUS = { vacant: "Bakante", in_use: "Naglalaro", parked: "Naka-park", maintenance: "Maintenance", offline: "Offline" };
function pcKey(pc) { return pc.status === "in_use" && pc.parked ? "parked" : pc.status; }
// The Hub sends a tiny "I am alive" signal every 30 seconds (Realtime Database, free and not counted like Firestore).
// A Hub is gone when the signal is older than ~100 seconds. The clocks of the Hub and of this device may disagree:
// when they agree we use the age of the signal; once we have SEEN it move, we trust our own clock only.
async function loadAlive() {
  try {
    const r = await fetch(`${RTDB}/alive/${uid}.json?auth=${encodeURIComponent(idToken)}`);
    if (!r.ok) { alive = {}; return; }
    alive = (await r.json()) || {};
    const now = Date.now();
    for (const [id, a] of Object.entries(alive)) {
      const s = seen[id];
      if (!s) seen[id] = { at: a.at, local: now, changed: false };
      else if (a.at > s.at) seen[id] = { at: a.at, local: now, changed: true };      // it moved forward (a Hub never goes back)
    }
  } catch (e) { alive = {}; }
}
function liveInfo(s) {
  const a = alive[s.shopId];
  if (!a || typeof a.at !== "number") return null;                              // no signal (yet): use the Firestore update time
  const now = Date.now(), age = now - a.at, sn = seen[s.shopId] || { local: now, changed: false };
  if (sn.changed) return { ok: now - sn.local < ALIVE_MS, at: a.at };           // we saw it move: our own clock
  if (age >= -60000 && age < 300000) return { ok: age < ALIVE_MS, at: a.at };   // the clocks agree
  if (age >= 300000) return { ok: false, at: a.at };                            // old: gone (until we see it move)
  return { ok: now - sn.local < ALIVE_MS, at: a.at };                           // this device's clock is behind
}
function liveness(s) {
  const info = liveInfo(s);
  if (info) {
    const t = new Date(info.at).toLocaleTimeString("fil-PH", { hour: "numeric", minute: "2-digit", second: "2-digit" });
    return info.ok ? el("span", { class: "live ok" }, el("i"), `Buhay · huling hudyat ${t}`)
                   : el("span", { class: "live stale" }, el("i"), `Hindi nakakonekta ang Hub · huling hudyat ${t}`);
  }
