<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarvsPC-Piso · Dashboard ng owner</title>
<style>
  :root { --paper:#eef2f8; --card:#fff; --ink:#10233f; --muted:#4b5d78; --line:#d5deeb; --navy:#10233f; --sun:#ffc93c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .hidden { display:none !important; }
  button, input { font:inherit; color:inherit; }
  input { padding:10px 12px; border:1px solid #a9b8d0; border-radius:8px; background:#fff; min-height:44px; width:100%; }
  button { padding:9px 14px; border-radius:8px; border:1px solid #a9b8d0; background:#fff; cursor:pointer; min-height:44px; }
  button.primary { background:var(--navy); color:#fff; border-color:var(--navy); font-weight:600; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--sun); outline-offset:1px; }
  .top { background:var(--navy); color:#f2f5fa; padding:12px 20px; display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
  .logo { width:38px; height:38px; border-radius:10px; background:var(--sun); color:var(--navy); display:grid; place-items:center; font-weight:700; }
  .top b { font-size:17px; }
  .top .who { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:13px; color:#c9d6ea; }
  .top button { background:transparent; color:#f2f5fa; border-color:#3a5886; min-height:40px; }
  main { max-width:1200px; margin:0 auto; padding:20px; display:grid; gap:18px; }
  .login { max-width:380px; margin:12vh auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:26px; display:grid; gap:12px; }
  .login h1 { margin:0; font-size:24px; }
  .login label { display:grid; gap:4px; font-size:13px; color:var(--muted); }
  .msg { min-height:21px; font-size:14px; color:#b91c1c; margin:0; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; }
  .tabs button[aria-pressed="true"] { background:var(--navy); color:#fff; border-color:var(--navy); }
  .live { font-size:13px; border-radius:99px; padding:4px 12px; display:inline-flex; align-items:center; gap:8px; font-weight:600; }
  .live i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .ok { background:#dcfce7; color:#14532d; } .ok i { background:#15803d; }
  .stale { background:#fef3c7; color:#78350f; } .stale i { background:#b45309; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; }
  .card { border-radius:16px; padding:16px 18px; color:#fff; }
  .card b { display:block; font-size:28px; line-height:1.15; }
  .card span { font-size:13px; }
  .c-amber { background:#b45309; } .c-violet { background:#6d28d9; } .c-blue { background:#1d4ed8; } .c-teal { background:#0f766e; } .c-red { background:#b91c1c; }
  .block { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; min-width:0; }
  .block h2 { margin:0 0 10px; font-size:17px; }
  .grid2 { display:grid; grid-template-columns:minmax(0, 3fr) minmax(0, 2fr); gap:18px; align-items:start; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #e3e9f3; white-space:nowrap; }
  th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .pill { display:inline-flex; align-items:center; gap:7px; border-radius:99px; padding:2px 10px; font-weight:600; font-size:13px; }
  .pill i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .p-vacant { background:#dcfce7; color:#14532d; } .p-vacant i { background:#15803d; }
  .p-in_use { background:#dbeafe; color:#1e3a8a; } .p-in_use i { background:#1d4ed8; }
  .p-parked { background:#ede9fe; color:#4c1d95; } .p-parked i { background:#6d28d9; }
  .p-maintenance { background:#fef3c7; color:#78350f; } .p-maintenance i { background:#b45309; }
  .p-offline { background:#e2e8f0; color:#334155; } .p-offline i { background:#64748b; }
  .chart { display:flex; align-items:flex-end; gap:10px; height:170px; border-bottom:1px solid var(--line); padding-top:8px; }
  .chart .col { flex:1 1 0; height:100%; display:flex; align-items:flex-end; justify-content:center; gap:4px; }
  .chart .col i { width:16px; border-radius:4px 4px 0 0; display:block; min-height:2px; }
  .lbl { display:flex; gap:10px; padding-top:6px; font-size:12px; color:#33445f; }
  .lbl div { flex:1 1 0; text-align:center; } .lbl b { display:block; color:var(--ink); }
  .legend { display:flex; flex-wrap:wrap; gap:14px; font-size:13px; color:#33445f; margin-bottom:6px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .empty { color:var(--muted); }
  .foot { font-size:12.5px; color:var(--muted); }
  @media (max-width: 800px) { .grid2 { grid-template-columns:minmax(0, 1fr); } main { padding:14px; } }
</style>
</head>
<body>

<div class="login hidden" id="loginBox">
  <h1>Dashboard ng owner</h1>
  <p class="foot" style="margin:0">Mag-login gamit ang email at password na ibinigay ng MarvsPC.</p>
  <form id="loginForm" style="display:grid;gap:12px">
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Pumasok</button>
    <p class="msg" id="loginMsg" role="status"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="logo" aria-hidden="true">MP</div><b>MarvsPC-Piso</b>
    <div class="who"><span id="who"></span><button type="button" id="refresh">I-refresh</button><button type="button" id="logout">Logout</button></div>
  </header>
  <main>
    <div class="tabs" id="tabs" role="group" aria-label="Mga shop"></div>
    <div id="view"></div>
    <p class="foot" id="foot"></p>
  </main>
</div>

<script>
// Public project key (not a secret). The data is protected by the Firestore rules, not by this key.
const API_KEY = "AIzaSyBVsogVXAX6BX8wwfNoosjL0BHci4h2Mgk", PROJECT = "cashlesspisonet";
let AUTH = "https://identitytoolkit.googleapis.com/v1", TOKEN = "https://securetoken.googleapis.com/v1/token", STORE = "https://firestore.googleapis.com/v1";
{ // tests only, and only on this computer: point the page at a pretend Firebase
  const t = new URLSearchParams(location.search).get("test_api");
  if (t && ["localhost", "127.0.0.1"].includes(location.hostname)) { AUTH = t + "/idt/v1"; TOKEN = t + "/tok/v1/token"; STORE = t + "/fs/v1"; }
}
const $ = (s) => document.querySelector(s);
const RT = "marvspc_rt";
let idToken = null, uid = null, shops = [], current = "all", timer = null, tick = null, fetchedAt = null, lastActive = Date.now();
// Updates by itself: every 15 seconds while someone is looking at the page, every 2 minutes when nobody
// touched it for 5 minutes, and not at all while the tab is hidden (every read counts against the free quota).
for (const ev of ["mousemove", "keydown", "click", "touchstart", "scroll"]) addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true });
const pollDelay = () => (Date.now() - lastActive < 300000 ? 15000 : 120000);
async function poll() {
  clearTimeout(timer);
  if (!idToken) return;
  if (!document.hidden) await load().catch(() => {});
  timer = setTimeout(poll, document.hidden ? 15000 : pollDelay());
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && idToken) poll(); });

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") e.className = v; else if (v !== null && v !== undefined) e.setAttribute(k, v); }
  for (const k of kids.flat()) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const peso = (n) => "₱" + Number(n || 0).toLocaleString("en-PH", { maximumFractionDigits: 2 });
function mins(m) { const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h} oras ${r} min` : `${h} oras`) : `${r} min`; }
function clock(sec) { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60; return `${h}:${String(m).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`; }

// ---- Firestore typed values -> plain values ----
function fromFs(v) {
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(fromFs);
  if ("mapValue" in v) return Object.fromEntries(Object.entries(v.mapValue.fields || {}).map(([k, x]) => [k, fromFs(x)]));
  return null;
}

// ---- sign-in ----
async function post(url, body, headers) {
  const r = await fetch(url, { method: "POST", headers: headers || { "Content-Type": "application/json" }, body });
  return [r, await r.json().catch(() => ({}))];
}
async function signIn(email, password) {
  const [r, d] = await post(`${AUTH}/accounts:signInWithPassword?key=${API_KEY}`, JSON.stringify({ email, password, returnSecureToken: true }));
  if (!r.ok) {
    const code = ((d.error || {}).message || "").split(" ")[0];
    throw new Error(code === "TOO_MANY_ATTEMPTS_TRY_LATER" ? "Masyadong maraming subok. Maghintay muna." : "Mali ang email o password.");
  }
  idToken = d.idToken; uid = d.localId; localStorage.setItem(RT, d.refreshToken); $("#who").textContent = email;
}
async function resume() {
  const rt = localStorage.getItem(RT);
  if (!rt) return false;
  const [r, d] = await post(`${TOKEN}?key=${API_KEY}`, `grant_type=refresh_token&refresh_token=${encodeURIComponent(rt)}`, { "Content-Type": "application/x-www-form-urlencoded" });
  if (!r.ok) { localStorage.removeItem(RT); return false; }
  idToken = d.id_token; uid = d.user_id; localStorage.setItem(RT, d.refresh_token || rt);
  return true;
}
function leave() { localStorage.removeItem(RT); idToken = null; clearTimeout(timer); clearInterval(tick); $("#app").classList.add("hidden"); $("#loginBox").classList.remove("hidden"); }

// ---- load the owner's shops (the filter on ownerUid is what the security rules require) ----
async function load() {
  const q = { structuredQuery: { from: [{ collectionId: "shops" }], where: { fieldFilter: { field: { fieldPath: "ownerUid" }, op: "EQUAL", value: { stringValue: uid } } } } };
  let [r, d] = await post(`${STORE}/projects/${PROJECT}/databases/(default)/documents:runQuery`, JSON.stringify(q), { "Content-Type": "application/json", Authorization: "Bearer " + idToken });
  if (r.status === 401 && await resume()) {
    [r, d] = await post(`${STORE}/projects/${PROJECT}/databases/(default)/documents:runQuery`, JSON.stringify(q), { "Content-Type": "application/json", Authorization: "Bearer " + idToken });
  }
  if (r.status === 401) return leave();
  if (r.status === 403) { $("#view").replaceChildren(el("p", { class: "block" }, "Hindi pa naka-activate ang account na ito. Sabihin sa MarvsPC na idagdag ito.")); return; }
  if (!r.ok) throw new Error("Hindi makuha ang data.");
  shops = d.filter((x) => x.document).map((x) => fromFs({ mapValue: { fields: x.document.fields } }));
  shops.sort((a, b) => a.shopName.localeCompare(b.shopName));
  fetchedAt = new Date();
  draw();
}

// ---- drawing ----
const STATUS = { vacant: "Bakante", in_use: "Naglalaro", parked: "Naka-park", maintenance: "Maintenance", offline: "Offline" };
function pcKey(pc) { return pc.status === "in_use" && pc.parked ? "parked" : pc.status; }
function liveness(s) {
  const ageMin = (Date.now() - Date.parse(s.updatedAt)) / 60000;
  const at = new Date(s.updatedAt).toLocaleTimeString("fil-PH", { hour: "numeric", minute: "2-digit" });
  return ageMin > 15 ? el("span", { class: "live stale" }, el("i"), `Hindi nakakonekta ang Hub · huling update ${at}`)
                     : el("span", { class: "live ok" }, el("i"), `Buhay · huling update ${at}`);
}
function sum(f) { return shops.reduce((n, s) => n + f(s), 0); }
function card(cls, value, label) { return el("div", { class: "card " + cls }, el("b", {}, value), el("span", {}, label)); }
function online(s) { return s.pcs.filter((p) => p.status !== "offline").length; }

function chart(week) {
  const max = Math.max(1, ...week.map((d) => Math.max(d.benta, d.kinita)));
  const bars = el("div", { class: "chart", role: "img", "aria-label": "Benta at kinita sa huling 7 araw" });
  const lbl = el("div", { class: "lbl" });
  for (const d of week) {
    bars.append(el("div", { class: "col" },
      Object.assign(el("i"), { style: `height:${Math.round(d.benta / max * 100)}%;background:#6d28d9` }),
      Object.assign(el("i"), { style: `height:${Math.round(d.kinita / max * 100)}%;background:#b45309` })));
    lbl.append(el("div", {}, el("b", {}, new Date(d.date + "T00:00:00").toLocaleDateString("fil-PH", { weekday: "short" })), peso(d.benta)));
  }
  return el("section", { class: "block" }, el("h2", {}, "Kita: huling 7 araw"),
    el("div", { class: "legend" }, el("span", {}, el("i", { style: "background:#6d28d9" }), "Benta / load"), el("span", {}, el("i", { style: "background:#b45309" }), "Kinita (nagamit)")), bars, lbl);
}
function pcTable(s) {
  const body = el("tbody");
  for (const pc of s.pcs) {
    const k = pcKey(pc), left = pc.status === "in_use" && pc.endsAt ? clock(pc.endsAt - Date.now() / 1000) : "—";
    body.append(el("tr", {}, el("td", {}, el("b", {}, pc.name)),
      el("td", {}, el("span", { class: "pill p-" + k }, el("i"), STATUS[k] || k)), el("td", {}, pc.user || "—"),
      el("td", { "data-ends": pc.status === "in_use" && pc.endsAt ? pc.endsAt : "" }, left)));
  }
  if (!s.pcs.length) body.append(el("tr", {}, el("td", { colspan: 4, class: "empty" }, "Wala pang PC.")));
  return el("section", { class: "block", style: "overflow-x:auto" }, el("h2", {}, "Mga PC"),
    el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "PC"), el("th", {}, "Status"), el("th", {}, "Naglalaro"), el("th", {}, "Natitirang oras"))), body));
}
function chips(items) {
  return el("div", { style: "display:flex;flex-wrap:wrap;gap:10px" }, items.map(([v, l]) =>
    el("div", { class: "block", style: "padding:8px 14px" }, el("b", {}, v), " ", l)));
}
function oneShop(s) {
  const t = s.today;
  return el("div", { style: "display:grid;gap:18px" },
    el("div", {}, liveness(s)),
    el("div", { class: "cards" }, card("c-amber", peso(t.consumed), "Kinita ngayon (nagamit na oras)"), card("c-violet", peso(t.income), "Benta / load ngayon"),
      card("c-blue", `${online(s)} / ${s.pcs.length}`, "Online na PC"), card("c-teal", t.accounts, "Customer accounts"), card("c-red", t.pending, "Naghihintay ng approval")),
    chips([[peso(t.cash || 0), "Cash"], [peso(t.gcash || 0), "GCash"], [t.walkins || 0, "Walk-in"]]),
    el("div", { class: "grid2" }, pcTable(s), chart(s.week)));
}
function allShops() {
  const body = el("tbody");
  for (const s of shops) body.append(el("tr", {}, el("td", {}, el("b", {}, s.shopName)), el("td", {}, peso(s.today.consumed)), el("td", {}, peso(s.today.income)),
    el("td", {}, `${online(s)} / ${s.pcs.length}`), el("td", {}, liveness(s))));
  const week = {};
  for (const s of shops) for (const d of s.week) { week[d.date] = week[d.date] || { date: d.date, benta: 0, kinita: 0 }; week[d.date].benta += d.benta; week[d.date].kinita += d.kinita; }
  return el("div", { style: "display:grid;gap:18px" },
    el("div", { class: "cards" }, card("c-amber", peso(sum((s) => s.today.consumed)), "Kabuuang kinita ngayon"), card("c-violet", peso(sum((s) => s.today.income)), "Kabuuang benta / load ngayon"),
      card("c-blue", `${sum(online)} / ${sum((s) => s.pcs.length)}`, "Online na PC"), card("c-teal", sum((s) => s.today.accounts), "Customer accounts"), card("c-red", sum((s) => s.today.pending), "Naghihintay ng approval")),
    chips([[peso(sum((s) => s.today.cash || 0)), "Cash"], [peso(sum((s) => s.today.gcash || 0)), "GCash"], [sum((s) => s.today.walkins || 0), "Walk-in"]]),
    el("section", { class: "block", style: "overflow-x:auto" }, el("h2", {}, "Bawat branch"),
      el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Branch"), el("th", {}, "Kinita"), el("th", {}, "Benta"), el("th", {}, "Online na PC"), el("th", {}, "Kalagayan"))), body)),
    chart(Object.values(week).sort((a, b) => a.date.localeCompare(b.date))));
}
function draw() {
  const tabs = $("#tabs"); tabs.replaceChildren();
  const mk = (id, text) => { const b = el("button", { type: "button", "aria-pressed": String(current === id) }, text); b.onclick = () => { current = id; draw(); }; tabs.append(b); };
  if (!shops.length) { $("#view").replaceChildren(el("p", { class: "block empty" }, "Wala pang shop na naka-connect. Sa admin page ng shop, Settings, i-connect ang Cloud.")); return; }
  // Tabs are only for an owner with more than one branch. With one branch there is nothing to choose: no tabs at all.
  tabs.classList.toggle("hidden", shops.length < 2);
  if (current !== "all" && !shops.find((s) => s.shopId === current)) current = shops.length > 1 ? "all" : shops[0].shopId;
  if (shops.length === 1) current = shops[0].shopId;
  if (shops.length > 1) { mk("all", "Lahat ng branch"); for (const s of shops) mk(s.shopId, s.shopName); }
  $("#view").replaceChildren(current === "all" ? allShops() : oneShop(shops.find((s) => s.shopId === current)));
  $("#foot").textContent = "Pagtingin lang ito. Hindi magbabago ang shop mula rito. Kusang nag-a-update habang tinitingnan mo ito"
    + (fetchedAt ? ` (huling kuha: ${fetchedAt.toLocaleTimeString("fil-PH", { hour: "numeric", minute: "2-digit", second: "2-digit" })}).` : ".");
}
function tickClocks() {
  document.querySelectorAll("[data-ends]").forEach((td) => { const e = Number(td.dataset.ends); if (e) td.textContent = clock(e - Date.now() / 1000); });
}

// ---- start ----
async function open() {
  $("#loginBox").classList.add("hidden"); $("#app").classList.remove("hidden");
  await load().catch((e) => $("#view").replaceChildren(el("p", { class: "block" }, e.message)));
  clearTimeout(timer); clearInterval(tick);
  timer = setTimeout(poll, pollDelay()); tick = setInterval(tickClocks, 1000);
}
$("#loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("#loginMsg").textContent = "Sandali…";
  try { await signIn($("#email").value.trim(), $("#pw").value); $("#pw").value = ""; $("#loginMsg").textContent = ""; await open(); }
  catch (e) { $("#loginMsg").textContent = e.message; }
});
$("#logout").addEventListener("click", leave);
$("#refresh").addEventListener("click", () => load().catch(() => {}));
(async () => { if (await resume()) { $("#who").textContent = "naka-login"; open(); } else $("#loginBox").classList.remove("hidden"); })();
</script>
</body>
</html>
